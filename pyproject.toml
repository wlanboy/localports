[project]
name = "localports"
version = "0.1.0"
description = "Local port forwarding for kubernetes services"
readme = "README.md"
authors = [
    { name = "wlanboy", email = "wlanboy@github.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
localports = "localports:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
