[project]
name = "localports"
version = "0.1.0"
description = "Local port forwaring for kubernetes services"
readme = "README.md"
authors = [
    { name = "wlanboy", email = "wlanboy@github.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
localports = "localports:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
